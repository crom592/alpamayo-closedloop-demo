<div class="row" style="gap: 1rem; align-items: flex-start;">
  <div>
    <h3>주행 영상</h3>
    <video src="{{ camera_mp4 }}" autoplay loop muted style="max-width:420px;"></video>
  </div>
  <div style="flex:1;">
    <h3>사전 캐시된 한국어 Q&A (8개)</h3>
    {% for item in qa %}
    <div class="cot-card">
      <h4>Q: {{ item.q_kr or item.q or '' }}</h4>
      <p class="muted" style="margin: 0 0 0.3rem; font-size: 0.8rem;">EN: {{ item.q_en or '' }}</p>
      <p class="cot-text">A: {{ item.answer or item.a or '' }}</p>
    </div>
    {% endfor %}
  </div>
</div>
