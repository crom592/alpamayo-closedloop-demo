<section class="card">
  <h2>⑥ 폐루프 시뮬레이션 분석 — 단계별 trace + 메트릭 + PDF</h2>
  <p class="muted">
    폐루프(closed-loop) 시뮬레이션 결과 분석. 자율주행 모델(Alpamayo) ↔ 차량 컨트롤러 ↔
    Neural Rendering 카메라 합성이 매 사이클 상호작용한 결과입니다.
    Tab ①의 "폐루프 시뮬레이션 실행" 버튼으로 만든 결과(rollout)가 이 화면에 누적됩니다.
  </p>
  <form class="inline">
    <select name="uuid" id="cl-uuid"
            hx-get="/closedloop/load" hx-target="#cl-loaded" hx-swap="innerHTML" hx-trigger="change">
      <option value="">— rollout 선택 —</option>
      {% for r in rollouts %}
      <option value="{{ r.uuid }}">
        {{ r.uuid_short }} · {{ r.scenario_short }} · V2X="{{ r.v2x_text or '(none)' }}" · {{ "%.0f"|format(r.asl_mb) }}MB
      </option>
      {% endfor %}
    </select>
    <button type="button" class="btn"
            hx-post="/closedloop/extract_frames"
            hx-include="#cl-uuid"
            hx-vals='js:{"uuid": document.getElementById("cl-uuid").value}'
            hx-target="#cl-extract-status">
      📷 frames 추출
    </button>
    <button type="button" class="btn"
            hx-post="/closedloop/report"
            hx-include="#cl-uuid"
            hx-vals='js:{"uuid": document.getElementById("cl-uuid").value}'
            hx-target="#cl-report-status">
      📄 PDF 생성
    </button>
  </form>
  <div id="cl-extract-status"></div>
  <div id="cl-report-status"></div>
  <div id="cl-loaded"></div>
</section>
