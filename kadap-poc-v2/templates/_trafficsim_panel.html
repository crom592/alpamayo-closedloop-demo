{% include "_trafficsim_panel_body.html" %}
<div id="ts-poller" hx-swap-oob="outerHTML" aria-hidden="true" style="display:none;"
     {% if not paused %}hx-get="/trafficsim/tick?run_id={{ run_id }}"
     hx-trigger="load delay:300ms"
     hx-target="#ts-panel"
     hx-swap="innerHTML"{% endif %}></div>
<script>
  (function() {
    var fig = {{ figure|tojson }};
    var el = document.getElementById('ts-plot');
    if (el && window.Plotly) {
      Plotly.react(el, fig.data, fig.layout, {responsive: true, displayModeBar: false});
    }
  })();
</script>
