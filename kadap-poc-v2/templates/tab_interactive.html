<section class="card">
  <h2>③ 실시간 인터랙티브 시연 — V2X 프리셋 즉시 전환</h2>
  <p class="muted">
    사전 캐시된 카메라 영상이 자동 재생되는 동안 V2X 프리셋 버튼 클릭 → BEV가 0초 지연으로 즉시 전환.
    <strong>KATECH 시연 메인.</strong>
  </p>

  {% if not cache_ready %}
  <div class="model-status state-error">
    ⚠ demo_cache 없음 — <code>scripts/prerender_demo_cache_kadap.sh</code> 실행 후 새로고침.
  </div>
  {% else %}
  <form class="inline">
    <select name="scen_idx" id="int-scen"
            hx-get="/interactive/load" hx-target="#int-loaded" hx-swap="innerHTML" hx-trigger="change">
      <option value="">— 시나리오 선택 —</option>
      {% for s in scenarios %}
      <option value="{{ s.scen_idx }}">{{ s.label }}</option>
      {% endfor %}
    </select>
  </form>
  <div id="int-loaded"></div>
  {% endif %}
</section>
